</style></head><body><header class="topbar"><div class="topbar-left"><button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sideMenu">☰</button><div class="brand">✦ ASCEND</div></div><div class="quicklinks"><button class="quick-nav active" data-tab="dashboard">Dashboard</button><button class="quick-nav" data-tab="daily">Today</button><button class="quick-nav" data-tab="tasks">Tasks</button></div></header><div class="layout menu-closed" id="layout"><aside id="sideMenu"><div class="nav-section">Planner</div><div class="links"><button class="nav active" data-tab="dashboard">◈ Dashboard</button><button class="nav" data-tab="daily">◷ Today</button><button class="nav" data-tab="tasks">☑ Tasks</button><button class="nav" data-tab="weekly">▦ Week</button><div class="nav-section">Progression</div><button class="nav" data-tab="quests">⚑ Quests</button><button class="nav" data-tab="character">♜ Character</button><button class="nav" data-tab="achievements">🏆 Achievements</button><button class="nav" data-tab="skills">✧ Skills</button><button class="nav" data-tab="attributes">⬡ Attributes</button><div class="nav-section">Data</div><button class="nav" data-tab="history">◷ History &amp; Saves</button></div></aside><main id="app"></main></div><div id="menuScrim" class="menu-scrim hidden"></div><div id="toast" class="toast"></div><div id="modalRoot"></div><script>

const KEY='ascend-rpg-v01';
const defaults=['Strength','Endurance','Intelligence','Wisdom','Creativity','Charisma','Discipline'];
const id=()=>crypto.randomUUID();
const fresh=()=>({name:'Adventurer',xp:0,tasks:[],skills:[],attributes:defaults.map(name=>({id:id(),name,xp:0})),history:[],quests:[],achievementUnlocks:{},equippedTitle:'',portrait:''});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{state=fresh()}
function normalize(){
  state.name=typeof state.name==='string'?state.name:'Adventurer';
  state.xp=Number(state.xp)||0;
  for(const key of ['tasks','skills','attributes','history'])if(!Array.isArray(state[key]))state[key]=[];
  if(!Array.isArray(state.quests))state.quests=[];
  if(!state.achievementUnlocks||typeof state.achievementUnlocks!=='object'||Array.isArray(state.achievementUnlocks))state.achievementUnlocks={};
  if(typeof state.equippedTitle!=='string')state.equippedTitle='';
  if(typeof state.portrait!=='string'||(state.portrait&&!/^data:image\/(png|jpeg|webp);base64,/.test(state.portrait)))state.portrait='';
  state.quests=state.quests.filter(q=>q&&typeof q==='object').map(q=>({
    ...q,id:q.id||id(),title:String(q.title||'Untitled Quest'),description:String(q.description||''),
    targetDate:q.targetDate||'',skill:q.skill||'',attribute:q.attribute||'',xp:Number.isFinite(Number(q.xp))?Math.max(0,Math.round(Number(q.xp))):500,
    milestones:Array.isArray(q.milestones)?q.milestones.filter(m=>m&&typeof m==='object').map(m=>({id:m.id||id(),name:String(m.name||'Milestone'),done:!!m.done})):[],
    completed:!!q.completed,completedAt:q.completedAt||null
  }));
  state.tasks=state.tasks.map(t=>({...t,category:t.category||'Personal',repeat:t.repeat||'none',interval:Math.max(1,Number(t.interval)||1),done:!!t.done,priority:['low','normal','high','urgent'].includes(t.priority)?t.priority:'normal',time:t.time||'',duration:Math.max(0,Number(t.duration)||0),skill:t.skill||'',attribute:t.attribute||'',xp:Number(t.xp)||30,due:t.due||''}));
}
normalize();
const localToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let tab='dashboard', taskFilter='active', priorityFilter='all', statusFilter='active', viewDate=localToday(), weekOffset=0;
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const level=x=>Math.floor(Math.sqrt(Math.max(0,x)/100));

function nextDate(date,days){const [y,m,d]=date.split('-').map(Number);const v=new Date(y,m-1,d+days);return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`}
function repeatDays(t){return t.repeat==='daily'?1:t.repeat==='weekly'?7:t.repeat==='custom'?Math.max(1,Number(t.interval)||1):0}
function progress(x){const l=level(x),start=100*l*l,end=100*(l+1)*(l+1);return `<div class="bar"><div class="fill" style="width:${Math.max(0,Math.min(100,(x-start)/(end-start)*100))}%"></div></div><p class="muted small">${x-start} / ${end-start} XP to Level ${l+1}</p>`}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',3500)}
function options(items,selected=''){return `<option value="">None</option>`+items.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}
function header(title,subtitle){return `<h1>${title}</h1><p class="muted">${subtitle}</p>`}
function labelFor(key,identifier){return (state[key].find(x=>x.id===identifier)||{}).name||''}
function reward(title,base,skillId,attrId,category='Training',directTraining=false){
  const before=level(state.xp),details=[{type:'character',name:'Character',xp:base}];
  state.xp+=base;
  const skill=state.skills.find(x=>x.id===skillId);
  if(skill){const amount=(directTraining?base:Math.round(base*.7));skill.xp+=amount;details.push({type:'skill',name:skill.name,xp:amount})}
  const attr=state.attributes.find(x=>x.id===attrId);
  if(attr){const amount=(directTraining?base:Math.round(base*.4));attr.xp+=amount;details.push({type:'attribute',name:attr.name,xp:amount})}
  state.history.unshift({id:id(),title,category,awards:details,detail:details.map(x=>`+${x.xp} ${x.name} XP`).join(' · '),at:new Date().toISOString()});
  state.history=state.history.slice(0,1000);
  save();
  reconcileAchievements();
  const reached=CHARACTER_MILESTONES.filter(m=>before<m.level&&level(state.xp)>=m.level);
  toast(reached.length?`★ ${reached[reached.length-1].name} — Level ${level(state.xp)}!`:level(state.xp)>before?`LEVEL UP! Level ${level(state.xp)} — ${details[0].xp} XP earned`:`+${base} Character XP`);
}
function completeTask(t){

  const days=repeatDays(t);
  if(days&&t.due&&t.due>localToday()){toast('This recurring task is not due yet');return}
  if(days){
    // Carry one overdue occurrence forward, then schedule from today or the due date, whichever is later.
    t.due=nextDate(t.due && t.due>localToday()?t.due:localToday(),days);
    t.completedCount=(Number(t.completedCount)||0)+1;
    t.lastCompleted=new Date().toISOString();
  }else{t.done=true;t.lastCompleted=new Date().toISOString()}
  reward(t.name,t.xp,t.skill,t.attribute,t.category);
  if(state.history[0]){state.history[0].taskId=t.id;save()}
  render();

 document.querySelectorAll('[data-edit-quest]').forEach(b=>b.onclick=()=>{const q=getQuest(b);if(q&&!q.completed)openQuestEditor(q)});
 document.querySelectorAll('[data-add-milestone]').forEach(b=>b.onclick=()=>{const q=getQuest(b);if(q&&!q.completed)milestoneEditor(q)});
 document.querySelectorAll('[data-edit-milestone]').forEach(b=>b.onclick=()=>{const q=getQuest(b),m=q?.milestones.find(m=>m.id===b.dataset.mid);if(q&&!q.completed&&m)milestoneEditor(q,m)});
 document.querySelectorAll('[data-remove-milestone]').forEach(b=>b.onclick=()=>{const q=getQuest(b),m=q?.milestones.find(m=>m.id===b.dataset.mid);if(!q||q.completed||!m)return;showModal(`<h2>Remove Milestone?</h2><p class="muted">${esc(m.name)}</p><div class="modal-actions"><button class="secondary" data-close-modal>Cancel</button><button class="danger" id="confirmRemoveMilestone">Remove</button></div>`);document.getElementById('confirmRemoveMilestone').onclick=()=>{q.milestones=q.milestones.filter(x=>x.id!==m.id);save();closeModal();render()}});
 document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const q=getQuest(b);if(!q||q.completed)return;const i=q.milestones.findIndex(m=>m.id===b.dataset.moveId),j=i+Number(b.dataset.dir);if(i<0||j<0||j>=q.milestones.length)return;[q.milestones[i],q.milestones[j]]=[q.milestones[j],q.milestones[i]];save();render()});
 document.querySelectorAll('[data-quest-check]').forEach(b=>b.onchange=()=>{const q=getQuest(b),m=q?.milestones.find(m=>m.id===b.dataset.milestone);if(!q||q.completed||!m)return;m.done=b.checked;save();render()});
 document.querySelectorAll('[data-claim-quest]').forEach(b=>b.onclick=()=>{const q=getQuest(b);if(!q||q.completed||!q.milestones.length||q.milestones.some(m=>!m.done))return;showModal(`<h2>Complete ${esc(q.title)}?</h2><p class="muted">This will permanently mark the quest complete and award <strong>+${q.xp} Character XP</strong>${labelFor('skills',q.skill)?` and +${Math.round(q.xp*.7)} ${esc(labelFor('skills',q.skill))} XP`:''}${labelFor('attributes',q.attribute)?` and +${Math.round(q.xp*.4)} ${esc(labelFor('attributes',q.attribute))} XP`:''}. The reward can only be claimed once.</p><div class="modal-actions"><button class="secondary" data-close-modal>Cancel</button><button id="confirmClaim">Claim Reward</button></div>`);document.getElementById('confirmClaim').onclick=()=>{if(q.completed)return;q.completed=true;q.completedAt=new Date().toISOString();reward(`Quest completed: ${q.title}`,q.xp,q.skill,q.attribute,'Quest');if(state.history[0]){state.history[0].questId=q.id;save()}closeModal();render();toast(`Quest complete! +${q.xp} Character XP`)}});
 document.querySelectorAll('[data-delete-quest]').forEach(b=>b.onclick=()=>{const q=getQuest(b);if(!q)return;showModal(`<h2>Delete ${esc(q.title)}?</h2><p class="muted">The quest and its milestones will be removed. Previously earned XP and activity history will remain.</p><div class="modal-actions"><button class="secondary" data-close-modal>Cancel</button><button class="danger" id="confirmDeleteQuest">Delete Quest</button></div>`);document.getElementById('confirmDeleteQuest').onclick=()=>{state.quests=state.quests.filter(x=>x.id!==q.id);save();closeModal();render();toast('Quest deleted')}});
}

 app.innerHTML=header(isSkill?'Skills':'Attributes',isSkill?'Develop hobbies and specialized abilities.':'Build your character through real-world training.')+(isSkill?`<div class="card"><h3>Add Skill</h3><form id="addCategory" class="form"><input name="name" maxlength="60" placeholder="e.g. Japanese" required><button>Add</button></form></div>`:'')+`<div class="grid">${items.map(x=>`<div class="card"><div class="flex between"><strong>${esc(x.name)}</strong><div class="flex"><span class="pill">Level ${level(x.xp)}</span>${isSkill?masteryBadge(level(x.xp)):''}</div></div><p></p>${progress(x.xp)}<div class="flex"><button data-train="${esc(x.id)}">Train</button>${isSkill?`<button class="secondary" data-remove="${esc(x.id)}">Remove</button>`:''}</div></div>`).join('')}</div><div class="card"><p class="muted small">Training awards character XP and XP to this ${isSkill?'skill':'attribute'}. Attributes are permanent and cannot be removed.</p></div>`;

 }

function closeModal(){document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}
function showModal(content){
 const root=document.getElementById('modalRoot');
 document.body.style.overflow='hidden';
 root.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true">${content}</section></div>`;
 root.querySelectorAll('[data-close-modal]').forEach(b=>b.onclick=closeModal);
 root.querySelector('.modal-backdrop').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal()});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function taskFields(t={}){
 const categories=['Personal','Work','Hobbies','Health','Learning','Other'];
 if(t.category&&!categories.includes(t.category))categories.push(t.category);
 const selected=t.repeat||'none';
 return `<div class="field-grid">
 <label class="wide">Task name<input name="name" maxlength="100" value="${esc(t.name||'')}" required></label>
 <label>Category<select name="category">${categories.map(c=>`<option value="${esc(c)}" ${c===(t.category||'Personal')?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
 <label>Difficulty<select name="difficulty"><option value="10" ${t.xp===10?'selected':''}>Easy · 10 XP</option><option value="30" ${!t.xp||t.xp===30?'selected':''}>Normal · 30 XP</option><option value="60" ${t.xp===60?'selected':''}>Hard · 60 XP</option><option value="100" ${t.xp===100?'selected':''}>Epic · 100 XP</option></select></label>
 <label>XP override (optional)<input name="override" type="number" min="1" max="1000" placeholder="Use difficulty XP" value="${t.xp&&![10,30,60,100].includes(t.xp)?t.xp:''}"></label>
 <label>Priority<select name="priority">${['low','normal','high','urgent'].map(p=>`<option value="${p}" ${(t.priority||'normal')===p?'selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}</select></label>
 <label>Due date<input name="due" type="date" value="${esc(t.due||'')}"></label>
 <label>Start time (optional)<input name="time" type="time" value="${esc(t.time||'')}"></label>
 <label>Estimated duration (minutes)<input name="duration" type="number" min="0" max="1440" value="${Number(t.duration)||0}"></label>
 <label>Repeat<select name="repeat" id="taskRepeat"><option value="none" ${selected==='none'?'selected':''}>Does not repeat</option><option value="daily" ${selected==='daily'?'selected':''}>Daily</option><option value="weekly" ${selected==='weekly'?'selected':''}>Weekly</option><option value="custom" ${selected==='custom'?'selected':''}>Custom</option></select></label>
 <label id="taskIntervalField" ${selected==='custom'?'':'hidden'}>Repeat interval (days)<input name="interval" type="number" min="1" max="365" value="${Number(t.interval)||2}" ${selected==='custom'?'required':'disabled'}></label>
 <label>Skill<select name="skill">${options(state.skills,t.skill)}</select></label>
 <label>Attribute<select name="attribute">${options(state.attributes,t.attribute)}</select></label>
 </div>`;
}
function openTaskEditor(t){if(t&&t.__new){t=null}
 showModal(`<h2>${t?'Edit Task':'Add Task'}</h2><p class="muted small">A completed activity earns character XP plus 70% skill XP and 40% attribute XP when linked.</p><form id="taskEditor">${taskFields(t)}<div class="modal-actions"><button type="button" class="secondary" data-close-modal>Cancel</button><button type="submit">${t?'Save Changes':'Add Task'}</button></div></form>`);
 const repeatSelect=document.getElementById('taskRepeat'),intervalField=document.getElementById('taskIntervalField'),intervalInput=intervalField.querySelector('input');
 const updateInterval=()=>{const custom=repeatSelect.value==='custom';intervalField.hidden=!custom;intervalInput.disabled=!custom;intervalInput.required=custom};
 repeatSelect.addEventListener('change',updateInterval);updateInterval();
 document.getElementById('taskEditor').onsubmit=e=>{
  e.preventDefault();const f=new FormData(e.currentTarget);
  const name=String(f.get('name')).trim(),raw=String(f.get('override')).trim(),xp=raw?Number(raw):Number(f.get('difficulty')),repeat=String(f.get('repeat')),interval=repeat==='custom'?Number(f.get('interval')):Math.max(1,Number(t?.interval)||2);
  if(!name||!Number.isInteger(xp)||xp<1||xp>1000)return toast('Enter a task name and XP between 1 and 1000');
  if(repeat==='custom'&&(!Number.isInteger(interval)||interval<1||interval>365))return toast('Repeat interval must be 1–365 days');
  const due=String(f.get('due'))||(repeat!=='none'?localToday():'');
  const changes={name,xp,priority:String(f.get('priority')),time:String(f.get('time')),duration:Number(f.get('duration'))||0,category:String(f.get('category')),skill:String(f.get('skill')),attribute:String(f.get('attribute')),due,repeat,interval};
  if(t)Object.assign(t,changes);else state.tasks.push({id:id(),...changes,done:false,completedCount:0});
  save();closeModal();render();toast(t?'Task updated':'Task added');
 };
}
function bind(){

 if(portraitButton&&portraitInput)portraitButton.onclick=()=>portraitInput.click();
 if(portraitInput)portraitInput.onchange=async()=>{
  const file=portraitInput.files&&portraitInput.files[0];if(!file)return;
  if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('Choose a PNG, JPG, or WebP image');return}
  if(file.size>12*1024*1024){toast('Choose an image smaller than 12 MB');return}
  try{
   const bitmap=await createImageBitmap(file),canvas=document.createElement('canvas');
   canvas.width=320;canvas.height=320;
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas unavailable');
   const side=Math.min(bitmap.width,bitmap.height),sx=(bitmap.width-side)/2,sy=(bitmap.height-side)/2;
   ctx.drawImage(bitmap,sx,sy,side,side,0,0,320,320);bitmap.close?.();
   const portrait=canvas.toDataURL('image/jpeg',0.8);
   const previous=state.portrait;state.portrait=portrait;
   try{save()}catch(e){state.portrait=previous;toast('Browser storage is full; export your save and try a smaller image');return}
   render();toast('Portrait updated');
  }catch(e){toast('Unable to process this image')}

   const data=JSON.parse(await file.files[0].text());
   if(!data||typeof data!=='object'||!Array.isArray(data.tasks)||!Array.isArray(data.skills)||!Array.isArray(data.attributes)||!Array.isArray(data.history)||!Number.isFinite(Number(data.xp)))throw Error('Invalid Ascend save');
   showModal(`<h2>Replace current save?</h2><p class="muted">Importing this file replaces all progress currently stored in this browser. Export your existing save first if needed.</p><div class="modal-actions"><button class="secondary" data-close-modal>Cancel</button><button id="confirmImport">Import Save</button></div>`);
   document.getElementById('confirmImport').onclick=()=>{state=data;normalize();save();closeModal();render();toast('Save imported')};
  }catch(err){toast('Could not import: invalid JSON save')}
 };
}
const layout=document.getElementById('layout'),menuToggle=document.getElementById('menuToggle'),menuScrim=document.getElementById('menuScrim');
function setMenu(open){layout.classList.toggle('menu-closed',!open);menuToggle.setAttribute('aria-expanded',String(open));menuScrim.classList.toggle('hidden',!open||window.innerWidth>760)}
menuToggle.onclick=()=>setMenu(layout.classList.contains('menu-closed'));
menuScrim.onclick=()=>setMenu(false);
document.querySelectorAll('.nav,.quick-nav').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;setMenu(false);render()});
window.addEventListener('resize',()=>{menuScrim.classList.toggle('hidden',layout.classList.contains('menu-closed')||window.innerWidth>760)});
render();

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Ascend offline support unavailable:', err));
  });
}
</script></body></html>
